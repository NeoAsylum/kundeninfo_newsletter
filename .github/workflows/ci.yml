# Dünne CI-Hülle (Plan 8.6): Die Logik lebt im Makefile — diese Datei ist
# austauschbar, falls der Konzern GitLab/Jenkins nutzt (Frage B8).
# Actions stehen mit Commit-Hash da (der Tag im Kommentar), Python und Node mit voller
# Version: Python wie im Image (backend/Dockerfile), Node die aktuelle LTS-Linie.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      # Erst das Lockfile (genau die Versionen des Images), dann `make install`: Es findet
      # die Laufzeit-Abhängigkeiten erfüllt vor und ergänzt nur die Testwerkzeuge.
      - name: Abhängigkeiten installieren
        run: |
          pip install --require-hashes -r backend/requirements.lock
          make install

      - name: Konfig-Doku-Gate (.env.example vollständig?)
        run: python backend/scripts/check_env_example.py

      - name: Lint (ruff + mypy)
        run: make lint

      - name: Unit-Tests
        run: make test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"

      - name: Frontend-Testwerkzeug (npm ci aus dem Lockfile)
        run: make install-frontend

      - name: Chromium zur gepinnten Playwright-Version
        run: make install-frontend-browser

      - name: Frontend-Verhaltenstests
        run: make test-frontend
        env:
          FRONTEND_BROWSER: chromium-headless-shell

      - name: .env für Compose anlegen
        run: cp .env.example .env

      - name: API-Tests gegen PostgreSQL-tmpfs (inkl. Coverage-Gate 80 %)
        run: |
          docker compose -f compose.yaml -f compose.db.yaml -f compose.dev.yaml \
            --profile test up -d --wait postgres-test
          cd backend && python -m pytest tests/unit tests/api -q \
            --cov=app/domain --cov=app/mail --cov=app/api --cov=app/core

  integration:
    # Voller Stack (Keycloak, Mailpit) — nur auf main, vor Releases (Plan 8.1)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      # wie im Job check: erst das Lockfile, damit die Tests gegen die Versionen des Images laufen
      - run: |
          pip install --require-hashes -r backend/requirements.lock
          make install
      - run: cp .env.example .env
      - run: make test-integration
