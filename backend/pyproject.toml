# Nur Tooling-Konfiguration — Abhängigkeiten leben in requirements*.txt (eine Wahrheit).

[tool.ruff]
# Die älteste Python-Version, auf der der Code laufen muss: Entwicklerrechner ab 3.13,
# Image und CI auf 3.14 (backend/Dockerfile).
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: Tests gegen den echten Compose-Stack (make test-integration)",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Handgeschriebene DDL-Migrationen: Alembic-Signaturen sind für **kwargs zu streng
module = "app.db.alembic.*"
ignore_errors = true

[tool.coverage.run]
source = ["app/domain", "app/mail", "app/api", "app/core"]
# Ohne greenlet misst das Gate asynchronen Code systematisch zu niedrig: SQLAlchemys
# async-Schicht führt den eigentlichen DBAPI-Aufruf in einem Greenlet aus, und der
# Tracer folgt dem Wechsel nicht — die Messung bricht in jeder Funktion nach dem
# ERSTEN `await` ab. Symptom war ein als "nie ausgeführt" gemeldetes `return topic`.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
