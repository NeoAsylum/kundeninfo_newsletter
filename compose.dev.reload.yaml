# Optionales Live-Reload-Overlay (Bind-Mounts!):
#   docker compose -f compose.yaml -f compose.db.yaml -f compose.dev.yaml \
#     -f compose.dev.reload.yaml up -d
# Voraussetzung: Docker-Desktop-File-Sharing für das Repo-Verzeichnis erlaubt.
services:
  nginx:
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro

  api:
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
