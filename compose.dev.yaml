# DEV-Overlay: Mocks (Keycloak, Mailpit) und Port-Mappings.
# Bewusst OHNE Bind-Mounts: läuft ohne Docker-Desktop-File-Sharing (R10).
# Kein Live-Reload: make dev baut bei jedem Start neu, das dauert nur Sekunden.
services:
  nginx:
    ports:
      - "8080:80"

  keycloak:
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    image: stoerungsinfo-keycloak:dev
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Split-Horizon-Fix (Plan 5.5): Issuer/iss-Claim stabil auf localhost:8081,
      # egal ob der Request vom Browser (Host) oder Backend (Compose-Netz) kommt.
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    networks: [appnet]
    healthcheck:
      # /health/ready liegt auf dem Management-Port 9000. Seit Keycloak 26.6 ist der Port
      # schon offen, während Datenbank-Migration und Realm-Import noch laufen — bereit ist
      # der Server erst, wenn der Endpunkt 200 antwortet (vorher 503). Das Image hat weder
      # curl noch wget, deshalb die Anfrage über /dev/tcp der Shell.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3
          && read -r _ status _ <&3
          && [ "$$status" = 200 ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    networks: [appnet]
    ports:
      - "8025:8025"   # Web-UI + REST-API (Test-Assertions)
      - "1025:1025"   # SMTP, vom Host erreichbar für lokale Testläufe
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Wegwerf-DB für API-Tests (make test-db): tmpfs, kein Volume, eigener Port.
  # Läuft nur mit --profile test, nie im normalen Stack.
  postgres-test:
    # Derselbe Stand wie deploy/postgres/Dockerfile (ein Test hält beide zusammen)
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: ["test"]
    environment:
      POSTGRES_DB: newsletter_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    # Dort erwartet das Image ab PostgreSQL 18 sein Volume; das Datenverzeichnis ist das
    # Unterverzeichnis 18/docker.
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "3307:5432"
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newsletter_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
