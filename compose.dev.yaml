# DEV-Overlay: Mocks (Keycloak, Mailpit) und Port-Mappings.
# Bewusst OHNE Bind-Mounts: läuft ohne Docker-Desktop-File-Sharing (R10).
# Kein Live-Reload: make dev baut bei jedem Start neu, das dauert nur Sekunden.
services:
  nginx:
    ports:
      - "8080:80"

  keycloak:
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    image: stoerungsinfo-keycloak:dev
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Split-Horizon-Fix (Plan 5.5): Issuer/iss-Claim stabil auf localhost:8081,
      # egal ob der Request vom Browser (Host) oder Backend (Compose-Netz) kommt.
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    networks: [appnet]
    healthcheck:
      # Keycloak >= 25: /health/ready liegt auf Management-Port 9000; das Image
      # hat kein curl/wget → TCP-Connect auf den Management-Port als Ready-Signal.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    networks: [appnet]
    ports:
      - "8025:8025"   # Web-UI + REST-API (Test-Assertions)
      - "1025:1025"   # SMTP, vom Host erreichbar für lokale Testläufe
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Wegwerf-DB für API-Tests (make test-db): tmpfs, kein Volume, eigener Port.
  # Läuft nur mit --profile test, nie im normalen Stack.
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: newsletter_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      # Unterverzeichnis, damit der tmpfs-Mountpunkt (root) nicht das PGDATA selbst ist.
      PGDATA: /var/lib/postgresql/data/pgdata
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "3307:5432"
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newsletter_test"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
