# PROD-Overlay: TLS, restart-Policies, Ressourcen-Limits, Log-Rotation, Härtung.
# Go-Live-Zustand: make prod-localdb (Basis + db + prod) — nach DB-Cutover: make prod.
services:
  nginx:
    # 0.0.0.0 explizit: Ohne die Adresse bindet Docker zusätzlich [::], und diese
    # IPv6-Verbindungen laufen über den userland docker-proxy in INPUT — an jeder
    # iptables-Beschränkung in DOCKER-USER vorbei (siehe deploy/vm/firewall.sh).
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 128m
    # Als Template, nicht als fertige conf: Der Standard-Entrypoint des nginx-Images
    # setzt ${PUBLIC_HOST} ein. Ohne konkreten server_name müsste die http→https-
    # Weiterleitung den vom Client behaupteten Host-Header einsetzen — angreifbar.
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST fehlt (Hostname des Portals)}
    volumes:
      - ./deploy/nginx/conf.d/app.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH fehlt in .env}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH fehlt in .env}:/etc/nginx/tls/server.key:ro
    logging: &logrotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    logging: *logrotate
