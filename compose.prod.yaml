# PROD-Overlay: TLS, restart-Policies, Ressourcen-Limits, Log-Rotation, Härtung.
# Aufruf: make prod (Basis + db + prod) — PostgreSQL läuft als Container mit (ADR-0030).
services:
  nginx:
    # 0.0.0.0 explizit: Ohne die Adresse bindet Docker zusätzlich [::], und diese
    # IPv6-Verbindungen laufen über den userland docker-proxy in INPUT — an jeder
    # iptables-Beschränkung in DOCKER-USER vorbei (siehe deploy/vm/firewall.sh).
    # Unter Podman (ADR-0033) gilt diese Begründung nicht; rootless brauchen die beiden
    # Ports und `cpus` je eine Freigabe auf dem Host (RUNBOOK 1b).
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    # always, nicht unless-stopped (alle drei Dienste): Podman vor 5.8.2 bringt nach einem
    # Neustart der VM nur Container mit dieser Policy zurück (ADR-0033). Folge: Ein mit
    # „stop“ angehaltener Stack läuft nach einem Neustart wieder — „down“ hält ihn aus.
    restart: always
    cpus: "0.5"
    mem_limit: 128m
    # Als Template, nicht als fertige conf: Der Standard-Entrypoint des nginx-Images
    # setzt ${PUBLIC_HOST} ein. Ohne konkreten server_name müsste die http→https-
    # Weiterleitung den vom Client behaupteten Host-Header einsetzen — angreifbar.
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST fehlt (Hostname des Portals)}
    volumes:
      - ./deploy/nginx/conf.d/app.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH fehlt in .env}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH fehlt in .env}:/etc/nginx/tls/server.key:ro
    logging: &logrotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    logging: *logrotate

  postgres:
    restart: always
    # Ohne Limits für CPU und Speicher: Die Größe der Ziel-VM steht nicht fest (Frage B7).
    logging: *logrotate
