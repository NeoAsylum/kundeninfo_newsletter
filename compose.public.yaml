# Overlay für den öffentlich erreichbaren Betrieb (Pilot/Demo im Internet).
#
#   docker compose -f compose.yaml -f compose.db.yaml -f compose.public.yaml up -d
#   (bzw. deploy/vm/deploy.sh)
#
# Unterschiede zu compose.prod.yaml:
#  * Keycloak läuft mit (es gibt keinen Konzern-IdP) — unter /idp hinter NGINX,
#    mit PostgreSQL als Speicher (eigene DB `keycloak`) statt der Dev-H2-Datei.
#  * TLS-Zertifikate kommen von Let's Encrypt (certbot-Volume) statt Konzern-PKI.
#  * Speicherlimits sind auf 1,8 GB RAM ausgelegt (Summe ~1,6 GB + Swap).
# Kein Mailpit: es wird echt versendet (SMTP_* in der .env).
services:
  nginx:
    build:
      dockerfile: deploy/nginx/Dockerfile.public
    image: stoerungsinfo-nginx:public
    environment:
      # Hostname für Serverblock und Zertifikatspfad (aus PUBLIC_BASE_URL abgeleitet,
      # gesetzt von deploy/vm/deploy.sh)
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST fehlt (z. B. kunden-stoerungs-info.com)}
    # 0.0.0.0 ist hier SICHERHEITSRELEVANT, nicht kosmetisch: Ohne die explizite
    # Adresse bindet Docker zusätzlich [::]:443. Diese IPv6-Verbindungen bedient der
    # userland docker-proxy auf dem Host, sie laufen also über INPUT und berühren die
    # Kette DOCKER-USER nie — genau dort steht aber die Beschränkung auf
    # Cloudflare-Bereiche (deploy/vm/firewall.sh). Ergebnis war ein Origin, der über
    # IPv6 direkt erreichbar blieb, obwohl IPv4 korrekt gesperrt war; nachgemessen mit
    # curl --resolve auf die Origin-IPv6: HTTP 200 statt Timeout. Zusätzlich ersetzt
    # der docker-proxy die Quelladresse durch das Docker-Gateway, womit alle
    # Ratenlimits und der Keycloak-Brute-Force-Zähler auf einen Schlüssel kollabieren.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 96m
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      keycloak:
        condition: service_started
    logging: &logrotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp
    # Nur die tatsächlich benötigten Variablen statt der kompletten .env: Der
    # internetseitige Container braucht weder DB_ROOT_PASSWORD noch die
    # Keycloak-Admin-Zugangsdaten (Grundsatz der geringsten Rechte).
    #
    # `env_file: !reset null` ist dafür zwingend. Compose ENTFERNT das `env_file: .env`
    # aus compose.yaml beim Zusammenführen nicht, und `env_file: []` hängt nur an —
    # ohne !reset bekäme der Container die Aufzählung unten PLUS die komplette .env,
    # und die Begründung darüber wäre unwahr (nachgemessen: DB_ROOT_PASSWORD war
    # gesetzt, mit !reset nur noch die Aufzählung). Die Liste ist vollständig: je
    # Settings-Feld eine Variable — tests/unit/test_config.py prüft das.
    env_file: !reset null
    environment:
      APP_ENV: ${APP_ENV}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_INTERNAL_BASE_URL: ${OIDC_INTERNAL_BASE_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      SMTP_MAX_PER_MINUTE: ${SMTP_MAX_PER_MINUTE:-30}
      SMTP_MAX_PER_DAY: ${SMTP_MAX_PER_DAY:-0}
      SMTP_BATCH_SIZE: ${SMTP_BATCH_SIZE:-50}
      SMTP_TIMEOUT_S: ${SMTP_TIMEOUT_S:-30}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-5}
      WORKER_STALE_AFTER_S: ${WORKER_STALE_AFTER_S:-600}
      WORKER_RETRY_BACKOFF_S: ${WORKER_RETRY_BACKOFF_S:-60,300,900}
      RETENTION_DAYS_RECIPIENTS: ${RETENTION_DAYS_RECIPIENTS:-}
      RETENTION_DAYS_AUDIT: ${RETENTION_DAYS_AUDIT:-}
      AUDIT_SUBSCRIPTIONS: ${AUDIT_SUBSCRIPTIONS:-false}
    logging: *logrotate

  postgres:
    # Kleine VM: shared_buffers begrenzen, max_connections niedrig — ein api-Prozess
    # plus Keycloak-Pool brauchen keine 100.
    # Diese Liste ersetzt die aus compose.db.yaml — die beiden log_-Angaben von dort
    # (ADR-0014) stehen deshalb hier noch einmal.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=192MB
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    mem_limit: 288m
    logging: *logrotate

  keycloak:
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    image: stoerungsinfo-keycloak:public
    # Produktionsmodus: HTTP nur intern (NGINX terminiert TLS), Speicher in PostgreSQL.
    # Ohne --optimized: Keycloak baut den DB-Provider beim Start selbst (~20 s mehr),
    # dafür bleibt dasselbe Image in DEV mit start-dev nutzbar.
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN fehlt}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD fehlt}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      # Eigenes Konto, nicht das der Anwendung: Eine Lücke im api-Container soll
      # nicht bis an Keycloaks Passwort-Hashes reichen (das Init-Skript des
      # Postgres-Image legt den Benutzer an und entzieht dem App-Konto die Rechte
      # auf 'keycloak'; deploy/vm/deploy.sh erzeugt nur das Passwort).
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD fehlt (deploy.sh erzeugt es)}
      # Öffentliche Adresse; NGINX reicht /idp durch (relative path)
      KC_HOSTNAME: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL fehlt}/idp
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
      # Heap klein halten — die VM hat 1,8 GB für alles. Das Limit muss über dem
      # Heap liegen (Metaspace, Code-Cache, Thread-Stacks, Direct Buffers),
      # sonst kommt der OOM-Killer statt eines Java-OutOfMemoryError.
      JAVA_OPTS_KC_HEAP: "-Xms192m -Xmx384m"
    restart: unless-stopped
    mem_limit: 640m
    networks: [appnet]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /idp/health/ready (KC_HTTP_RELATIVE_PATH gilt auch dort) liegt auf dem Management-Port 9000. Seit Keycloak 26.6 ist der Port
      # schon offen, während Datenbank-Migration und Realm-Import noch laufen — bereit ist
      # der Server erst, wenn der Endpunkt 200 antwortet (vorher 503). Das Image hat weder
      # curl noch wget, deshalb die Anfrage über /dev/tcp der Shell.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'HEAD /idp/health/ready HTTP/1.0\r\n\r\n' >&3
          && read -r _ status _ <&3
          && [ "$$status" = 200 ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 150s
    logging: *logrotate

  # Zertifikatsverwaltung: wird auf Abruf gestartet (certonly / renew), läuft NICHT
  # dauerhaft. Die Erneuerung übernimmt ein Cron-Job auf der VM, der danach NGINX
  # neu laden kann (deploy/vm/renew-cert.sh) — ein Dauer-Container könnte das
  # Nachladen nicht auslösen, das Zertifikat wäre nach 90 Tagen abgelaufen und der
  # Dienst offline.
  certbot:
    image: docker.io/certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: ["certbot"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    mem_limit: 128m
    logging: *logrotate

volumes:
  certbot_conf:
  certbot_webroot:
