# Overlay für den öffentlich erreichbaren Betrieb (Pilot/Demo im Internet).
#
#   docker compose -f compose.yaml -f compose.db.yaml -f compose.public.yaml up -d
#   (bzw. deploy/vm/deploy.sh)
#
# Unterschiede zu compose.prod.yaml:
#  * Keycloak läuft mit (es gibt keinen Konzern-IdP) — unter /idp hinter NGINX,
#    mit MariaDB als Speicher statt der Dev-H2-Datei.
#  * TLS-Zertifikate kommen von Let's Encrypt (certbot-Volume) statt Konzern-PKI.
#  * Speicherlimits sind auf 1,8 GB RAM ausgelegt (Summe ~1,6 GB + Swap).
# Kein Mailpit: es wird echt versendet (SMTP_* in der .env).
services:
  nginx:
    build:
      dockerfile: deploy/nginx/Dockerfile.public
    image: stoerungsinfo-nginx:public
    environment:
      # Hostname für Serverblock und Zertifikatspfad (aus PUBLIC_BASE_URL abgeleitet,
      # gesetzt von deploy/vm/deploy.sh)
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST fehlt (z. B. kunden-stoerungs-info.com)}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 96m
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      keycloak:
        condition: service_started
    logging: &logrotate
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 320m
    read_only: true
    tmpfs:
      - /tmp
    # Nur die tatsächlich benötigten Variablen statt der kompletten .env: Der
    # internetseitige Container braucht weder DB_ROOT_PASSWORD noch die
    # Keycloak-Admin-Zugangsdaten (Grundsatz der geringsten Rechte).
    environment:
      APP_ENV: ${APP_ENV}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_INTERNAL_BASE_URL: ${OIDC_INTERNAL_BASE_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      ADMIN_BOOTSTRAP_EMAILS: ${ADMIN_BOOTSTRAP_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-28800}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_AUTH_MODE: ${SMTP_AUTH_MODE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      SMTP_MAX_PER_MINUTE: ${SMTP_MAX_PER_MINUTE:-30}
      SMTP_BATCH_SIZE: ${SMTP_BATCH_SIZE:-50}
      SMTP_TIMEOUT_S: ${SMTP_TIMEOUT_S:-30}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-5}
      WORKER_STALE_AFTER_S: ${WORKER_STALE_AFTER_S:-600}
      WORKER_RETRY_BACKOFF_S: ${WORKER_RETRY_BACKOFF_S:-60,300,900}
      RETENTION_DAYS_RECIPIENTS: ${RETENTION_DAYS_RECIPIENTS:-}
      RETENTION_DAYS_AUDIT: ${RETENTION_DAYS_AUDIT:-}
      AUDIT_SUBSCRIPTIONS: ${AUDIT_SUBSCRIPTIONS:-false}
    logging: *logrotate

  mariadb:
    # Kleine VM: Buffer-Pool begrenzen, sonst nimmt InnoDB zu viel.
    # max-connections niedrig halten — jede Verbindung kostet Thread-Stack und
    # Puffer; ein api-Prozess plus Keycloak-Pool brauchen keine 60.
    command: >
      --innodb-buffer-pool-size=96M
      --max-connections=30
      --performance-schema=OFF
      --tmp-table-size=16M
      --max-heap-table-size=16M
    mem_limit: 288m
    logging: *logrotate

  keycloak:
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    image: stoerungsinfo-keycloak:public
    # Produktionsmodus: HTTP nur intern (NGINX terminiert TLS), Speicher in MariaDB.
    # Ohne --optimized: Keycloak baut den DB-Provider beim Start selbst (~20 s mehr),
    # dafür bleibt dasselbe Image in DEV mit start-dev nutzbar.
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN fehlt}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD fehlt}
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: ${DB_USER:-app}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      # Öffentliche Adresse; NGINX reicht /idp durch (relative path)
      KC_HOSTNAME: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL fehlt}/idp
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local
      # Heap klein halten — die VM hat 1,8 GB für alles. Das Limit muss über dem
      # Heap liegen (Metaspace, Code-Cache, Thread-Stacks, Direct Buffers),
      # sonst kommt der OOM-Killer statt eines Java-OutOfMemoryError.
      JAVA_OPTS_KC_HEAP: "-Xms192m -Xmx384m"
    restart: unless-stopped
    mem_limit: 640m
    networks: [appnet]
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      # Keycloak >= 25: /health/ready liegt auf Management-Port 9000; das Image
      # hat kein curl/wget → TCP-Connect als Ready-Signal.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 150s
    logging: *logrotate

  # Zertifikatsverwaltung: wird auf Abruf gestartet (certonly / renew), läuft NICHT
  # dauerhaft. Die Erneuerung übernimmt ein Cron-Job auf der VM, der danach NGINX
  # neu laden kann (deploy/vm/renew-cert.sh) — ein Dauer-Container könnte das
  # Nachladen nicht auslösen, das Zertifikat wäre nach 90 Tagen abgelaufen und der
  # Dienst offline.
  certbot:
    image: certbot/certbot:v5.1.0
    profiles: ["certbot"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    mem_limit: 128m
    logging: *logrotate

volumes:
  certbot_conf:
  certbot_webroot:
