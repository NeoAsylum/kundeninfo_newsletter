# DEV: HTTP auf Port 80 (Host-Mapping 8080). localhost gilt im Browser als
# Secure Context — Secure-Cookies funktionieren ohne TLS (Plan 5.6).
server {
    listen 80;
    server_name _;

    # Header kommen aus app-locations.inc (pro Location), siehe Kommentar dort.
    include /etc/nginx/includes/app-locations.inc;

    # Swagger-UI nur in DEV — das Backend liefert sie ohnehin nur bei APP_ENV=dev,
    # der öffentliche Serverblock beantwortet beide Pfade mit 404.
    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }
}
