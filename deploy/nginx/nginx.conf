worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $uri statt $request: der normalisierte Pfad OHNE Query-String. Die
    # Empfänger-Suche überträgt E-Mail-Adressen als ?query=… , und Logs dürfen
    # keine Empfängeradressen enthalten (ADR-0014). Korrelation über rid.
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent $request_time "$http_user_agent" rid=$request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    # Drosseln gegen Missbrauch öffentlich erreichbarer Endpunkte. Wichtig für die
    # offene Selbstregistrierung: Keycloak versendet Bestätigungs- und
    # Passwort-Reset-Mails über sein eigenes SMTP — die App-Drossel
    # (SMTP_MAX_PER_MINUTE) greift dort nicht.
    # idp_mail: Pfade, die eine Mail auslösen können (Passwort-Reset; die Registrierung nur
    # mit eingeschalteter Bestätigungsmail)
    limit_req_zone $binary_remote_addr zone=idp_mail:10m rate=6r/m;
    # idp_read: normale Anmelde- und Protokollschritte
    limit_req_zone $binary_remote_addr zone=idp_read:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
