[[ohne_scan]]
komponente = "NGINX (Paket von nginx.org)"
version = "1.30.5"
version_aus = "nginx:NGINX_VERSION"
aussage = "Der Scanner gleicht das Paket gegen die Datenbank von Alpine ab, obwohl es von nginx.org stammt; deshalb die Gegenprobe beim Hersteller: nginx.org führt 63 Sicherheitsmeldungen, 62 nennen einen verwundbaren Bereich, in dem 1.30.5 nicht liegt. Die Ausnahme ist CVE-2009-4487 (Steuerzeichen im Fehlerlog, vom Hersteller ohne Schweregrad und für alle Versionen geführt). 1.30.5 ist die aktuelle stabile Version."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "OpenSSL in den Images nginx und postgres (Alpine-Paket)"
version = "3.5.8-r0"
version_aus = "sbom:nginx:libssl3"
offen = true
aussage = "Der Hersteller hat am 2026-09-29 mit 3.5.9 dreizehn Lücken behoben (eine hoch eingestuft: CVE-2026-84782, DTLS; zwölf niedrig). Alpine bietet 3.5.9-r0 an, führt dazu aber noch keine Sicherheitsmeldung — der Scan zeigt deshalb nichts, und die gepinnten Basis-Images enthalten die Korrektur nicht. NGINX beendet in PROD und im Pilot die TLS-Verbindungen mit dieser Bibliothek; DTLS und QUIC nutzt die Konfiguration nicht. PostgreSQL bietet laut Voreinstellung des Image kein TLS an. Welche der zwölf übrigen hier greifen, ist nicht bewertet (siehe „Mögliche Maßnahmen“). Zum Vergleich: Das OpenSSL im api-Image ist ein Debian-Paket (3.5.7 mit zurückportierten Korrekturen), das der Scanner bewertet."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "OpenSSL in cryptography"
version = "4.0.3"
version_aus = "paket:cryptography:openssl"
aussage = "4.0.3 vom 2026-09-29 ist die neueste Patchversion der Linie 4.0; die Liste des Herstellers nennt keine Meldung, die sie betrifft. Die Anwendung nutzt diese Kopie für das Sitzungs-Cookie und die Signaturprüfung der ID-Tokens; TLS-Verbindungen laufen über das OpenSSL von Debian."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "psycopg-binary: libpq 18.6, OpenSSL 3.5.8, OpenLDAP 2.6.14, libcrypt (stehen in keiner Stückliste)"
version = "3.3.6"
version_aus = "paket:psycopg-binary"
aussage = "libpq 18.6 ist aktuell. OpenSSL 3.5.8 liegt eine Patchversion hinter 3.5.9 (dreizehn Meldungen, siehe oben); zwölf betreffen Funktionen, die libpq nicht nutzt, die dreizehnte (CVE-2026-35189, niedrig) setzt einen TLS-Handshake voraus. Der eigene Datenbank-Container bietet laut Voreinstellung des Image kein TLS an (am laufenden Server nicht nachgesehen); eine Gegenstelle, die sich im Docker-Netz als postgres ausgibt, könnte es. OpenLDAP 2.6.14 wird geladen, aber nur mit einer Service-Datei benutzt, die es im Image nicht gibt. Ein neueres psycopg-binary gibt es nicht."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "psycopg-binary: Bibliotheken aus CentOS 7 (Kerberos 1.15.1, Cyrus SASL 2.1.26, PCRE 8.32, libselinux 2.5 u. a.)"
version = "3.3.6"
version_aus = "paket:psycopg-binary"
aussage = "Die Pakete stehen in der Stückliste des Wheels; der Scanner hat sie erhalten und meldet dazu nichts, obwohl CentOS 7 seit 2024-06-30 keine Korrekturen mehr erhält und Red Hat für diese Stände offene Lücken führt (für die Client-Bibliotheken von Kerberos etwa CVE-2024-37370/-37371). Die Dateien werden beim Import von psycopg in den Prozess geladen (libselinux führt dabei eigenen Startcode aus); Eingaben von außen erreichen sie auf dem Weg der Anwendung (TCP, SCRAM-Passwort, eigene Datenbank) nicht — psycopg baut seine libpq mit gssencmode=disable. Erreichbar würden sie, wenn die Gegenstelle eine andere Anmeldemethode verlangte; das schließt require_auth in der DATABASE_URL aus (siehe „Mögliche Maßnahmen“)."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "uvloop: libuv 1.52.1"
version = "0.23.0"
version_aus = "paket:uvloop"
aussage = "uvloop 0.23.0 ist die neueste Version und enthält libuv 1.52.1, eine Version hinter 1.53.0 (2026-09-24, ohne genannte CVE). Die bekannten CVE zu libuv betreffen nach ihren Beschreibungen ältere Versionen, Windows oder 32-Bit-Bauten (nicht je CVE gegen 1.52.1 geprüft). Alle Verbindungen der Anwendung laufen über diese Kopie."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "httptools: llhttp 9.4.3, http-parser 2.9.4"
version = "0.9.0"
version_aus = "paket:httptools"
aussage = "httptools 0.9.0 ist die neueste Version und enthält laut Quellpaket llhttp 9.4.3, die neueste llhttp-Version; für beide ist keine offene Meldung verzeichnet. Zusätzlich liegt http-parser 2.9.4 bei (nur für die Zerlegung von URLs, Quelle seit 2022 archiviert); bekannte Schwächen dieses Stands sind nicht recherchiert. uvicorn parst damit jede Anfrage; Anfragen erreichen den Container nur über NGINX."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "Weitere fest eingebaute Bibliotheken: libyaml (PyYAML), libffi (cffi), QuickJS und Rust-Bibliotheken in ungeladenen NGINX-Modulen"
version = "–"
aussage = "Nicht geprüft. PyYAML wird beim Start der Anwendung nicht geladen, cffi mit libffi dagegen schon; die NGINX-Module njs und acme lädt die Konfiguration nicht."
stand = "2026-10-13"

# ===========================================================================
# Mögliche Maßnahmen — Reihenfolge: Wirkung im Verhältnis zum Aufwand. Gebaut, nachgemessen
# oder gegen einen Server erprobt ist davon nichts; der Bericht sagt das über der Tabelle.
# ===========================================================================

[[massnahme]]
titel = "Pakete der Alpine-Images beim Bau nachziehen (`apk upgrade` in den Dockerfiles von nginx und postgres)"
wirkung = "Hebt OpenSSL auf 3.5.9 (dreizehn Lücken, die der Scan nicht zeigt) und behebt die drei HIGH-Funde im nginx-Image sowie dessen MEDIUM-Funde. Für das nginx-Basis-Image sind die Pakete am 2026-10-13 als Aktualisierung verfügbar, für postgres ist das nicht nachgesehen. Die Pakete von nginx.org bleiben unberührt."
aufwand = "Klein im Code. Kehrseite: Derselbe Git-Stand ergibt je nach Bautag andere Paketstände — die Digest-Pins (ADR-0026) legen dann nur noch das Basis-Image fest; dazu eine neue Verbindung beim Bau (Paketquellen von Alpine). Alternative ohne diese Kehrseite: warten, bis das Basis-Image neu gebaut ist, und den Digest anheben."

[[massnahme]]
titel = "NGINX auf das schlanke Basis-Image wechseln (`nginx:stable-alpine-slim`)"
wirkung = "Entfernt 50 von 71 Paketen, darunter die ungenutzten Module samt libexpat und tiff (zwei der drei HIGH-Funde) — ohne Paketmanager beim Bau, die Digest-Pins bleiben wirksam. OpenSSL bleibt dabei auf dem Stand des Basis-Image."
aufwand = "Klein: FROM-Zeile in beiden NGINX-Dockerfiles, Konfiguration im Container prüfen."

[[massnahme]]
titel = "liblzma5 im api-Image nachziehen (`apt-get update && apt-get install -y --only-upgrade liblzma5` im Dockerfile)"
wirkung = "Sollte DSA-6549-1 beheben: Die korrigierte Version liegt seit 2026-10-07 in den Sicherheitsquellen von Debian. Sonst mit dem nächsten Basis-Image."
aufwand = "Klein. Dieselbe Kehrseite wie beim Nachziehen der Alpine-Pakete (Paketquellen von Debian beim Bau, kein fester Stand); die Zeile kann entfallen, sobald das Basis-Image die Korrektur enthält."

[[massnahme]]
titel = "Anmeldeweg zur Datenbank festlegen: `require_auth=scram-sha-256` und `gssencmode=disable` in der DATABASE_URL"
wirkung = "libpq lehnt laut Dokumentation jede andere Anmeldemethode ab, auch von einer gefälschten Gegenstelle; der Kerberos-Code der CentOS-7-Bibliotheken in psycopg-binary wäre dann nicht mehr erreichbar."
aufwand = "Etwa 0,25 PT: `.env.example`, README/RUNBOOK, Probe gegen den Server. `sslmode=disable` schlösse zusätzlich den TLS-Code der mitgelieferten OpenSSL-Kopie aus — eine Entscheidung, weil ein späteres TLS am Server dann ohne Wirkung bliebe."

[[massnahme]]
titel = "gosu aus dem postgres-Image entfernen und den Container als Nutzer postgres starten"
wirkung = "Der Scan sollte danach keinen der 60 gosu-Funde mehr melden, und der Container startet nicht mehr als root."
aufwand = "Etwa 0,5 PT: zwei Zeilen im Dockerfile, Start auf frischem und auf bestehendem Volume testen. Die Datei bleibt in der Basisschicht des Image enthalten."

[[massnahme]]
titel = "Dienst api härten: `security_opt: [\"no-new-privileges:true\"]` und `cap_drop: [\"ALL\"]` in compose.yaml"
wirkung = "Die setuid-Programme im Image (mount, su, passwd …) verlieren ihre Wirkung; damit entfällt die Voraussetzung der mount-Lücken unabhängig vom Inhalt der fstab, auch für künftige Lücken dieser Art. Die Funde bleiben im Scan stehen."
aufwand = "Klein: zwei Einträge, Integrationstest."

[[massnahme]]
titel = "psycopg-binary durch die libpq des Betriebssystems ersetzen (`psycopg` ohne Extra plus Debian-Paket libpq5, oder `psycopg[c]`)"
wirkung = "Die mitgelieferten Bibliotheken entfallen, darunter die sechs CentOS-7-Pakete und OpenSSL 3.5.8; libpq und ihre Abhängigkeiten kämen dann als Debian-Pakete, die der Scanner sieht und Debian pflegt."
aufwand = "Mittel (0,5–1,5 PT): Dockerfile, Lockfile, Tests. Kehrseiten: `psycopg` ohne Extra ist die reine Python-Fassung und laut psycopg-Dokumentation deutlich langsamer (Versanddurchsatz messen); `psycopg[c]` braucht beim Bau Compiler und libpq-dev. libpq käme als 17.x per apt aus Debian (Paketquellen beim Bau, kein fester Stand) und mit eigenen Scanner-Funden; ihre Vorgabe ist gssencmode=prefer — in der DATABASE_URL abschalten."

[[massnahme]]
titel = "pip aus dem Laufzeit-Image entfernen"
wirkung = "Nimmt die Funde unter „pip (mitgeliefert)“ aus dem Bericht. Der Code bleibt als Wheel für ensurepip im Image und läuft weiter in „make governance“; wirksam ist die Maßnahme erst, wenn auch das Wheel entfällt und das Werkzeug der Stückliste aus einem eigenen Image läuft."
aufwand = "Klein für den ersten Teil, etwa 1 PT für den zweiten. Im Betrieb wird pip in keinem Fall ausgeführt."

[[massnahme]]
titel = "Nachziehen, sobald neue Stände vorliegen: Keycloak-Image mit der pcre2-Korrektur, python:3.14.9-slim (geplant 2026-12-01), psycopg-binary mit OpenSSL ab 3.5.9"
wirkung = "Erwartet: Die Keycloak-Funde entfallen; von den vier in Python 3.14.8 offenen Lücken die beiden, die im 3.14-Zweig schon korrigiert sind (tarfile, tempfile) — poplib und base64 bleiben; der Rückstand der OpenSSL-Kopie in psycopg-binary schließt sich."
aufwand = "Je Fall klein: Digest bzw. Pin anheben, `make check`, `make governance`. Wer das wie oft tut, ist offen (Frage B10)."
