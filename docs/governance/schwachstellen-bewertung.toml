[[bewertung]]
image = "keycloak"
paket = "pcre2"
cves = ["CVE-2026-103111", "CVE-2026-86145", "CVE-2026-89161"]
status = "not_affected"
warum = "vulnerable_code_not_in_execute_path"
begruendung = "libpcre2-8 wird im Image nur von libselinux und libpcre2-posix gebunden und darüber beim Start kurz in uname, readlink, dirname und sed geladen; die JVM, ihre eigenen Dateien und die Linux-Bibliotheken in den JARs binden sie nicht. Außer libpcre2-8 selbst enthält keine Datei des Image die Funktionen, in denen die drei Fehler liegen (JIT-Übersetzung und -Stack, pcre2_dfa_match); libselinux ruft nur pcre2_compile und pcre2_match auf, und zwar für SELinux-Regeldateien, die im Container fehlen. Geprüft an den Dateien, nicht an einem laufenden Keycloak."
massnahme = "Red Hat hat die drei Lücken mit RHSA-2026:81532 (pcre2-10.40-7.el9_8) am 2026-10-12 behoben; die Datenbank des Scanners kannte das am Tag des Scans noch nicht. Digest in deploy/keycloak/Dockerfile anheben, sobald ein Keycloak-Image vorliegt, das dieses Paket laut Scan enthält; am 2026-10-13 gab es noch keines."
stand = "2026-10-13"

# ===========================================================================
# Was der Scanner nicht sieht oder nicht meldet
# ===========================================================================

[[ohne_scan]]
komponente = "Python (CPython), aus dem Quelltext gebaut"
version = "3.14.8"
version_aus = "api:PYTHON_VERSION"
aussage = "3.14.8 vom 2026-09-30 ist die neueste Version der Reihe 3.14. Darin sind mindestens vier veröffentlichte Lücken offen: CVE-2026-87910 (tarfile) und CVE-2026-12345 (tempfile.TemporaryDirectory) — im 3.14-Zweig korrigiert, aber erst nach 3.14.8 —, CVE-2025-15367 (poplib) und CVE-2025-12781 (base64 mit eigenem Alphabet). Nicht betroffen: Im Betrieb lädt nichts tarfile oder poplib, und TemporaryDirectory wird nicht aufgerufen; bei base64 weist joserfc die fraglichen Zeichen selbst ab, und beim Sitzungs-Cookie ändert die Schreibweise den geprüften Inhalt nicht. Für die genutzten Teile der Standardbibliothek (email, json, http.cookies, urllib.parse, ssl) ist sonst keine offene Meldung bekannt."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "libexpat, fest in Python eingebaut"
version = "2.8.5"
version_aus = "api:EXPAT_VERSION"
aussage = "Offen sind CVE-2026-77214 und CVE-2026-102633 (nur 32 Bit) — beide in Expat 2.9.0 vom 2026-10-05 behoben — sowie CVE-2025-66382 (Rechenzeit, in keiner Expat-Version behoben); das Expat-Projekt führt daneben weitere, nicht öffentliche Meldungen. Nicht betroffen, solange die Anwendung kein XML verarbeitet: Weder sie noch ein installiertes Paket außer pip lädt pyexpat."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "mpdecimal und HACL*, fest in Python eingebaut"
version = "2.5.1"
version_aus = "api:MPDEC_VERSION"
aussage = "Nicht auf veröffentlichte Meldungen geprüft (Versionsangabe: mpdecimal)."
stand = "2026-10-13"

[[ohne_scan]]
komponente = "PostgreSQL, aus dem Quelltext gebaut"
version = "18.6"
version_aus = "postgres:PG_VERSION"
aussage = "18.6 vom 2026-08-13 ist die aktuelle Minor-Version der Reihe 18 und behebt 28 CVE. Die Sicherheitsseite von postgresql.org nennt für die Reihe 18 keine Lücke, die erst nach 18.6 behoben oder noch offen ist; der nächste planmäßige Termin ist der 2026-11-12."
