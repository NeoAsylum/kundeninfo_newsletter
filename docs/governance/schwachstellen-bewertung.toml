# Bewertung der Schwachstellen — die einzige Datei in diesem Ordner, die von Hand gepflegt
# wird. Daraus und aus schwachstellen.json entsteht SCHWACHSTELLEN.md:
#
#     python ops/governance.py bericht
#
# [[bewertung]] — eine Lücke oder mehrere desselben Pakets in einem Image:
#   image        api | nginx | postgres | keycloak
#   paket        Quellpaket, wie es in SCHWACHSTELLEN.md fett über der Tabelle steht
#   ort          genau der Text, der dort hinter „in“ steht (Datei oder Paket, worin die
#                Bibliothek steckt); ohne „ort“ gilt der Eintrag nur für Funde ohne Ort
#   cves         Kennungen, für die der Eintrag gilt. Ohne „cves“ gälte er für ALLE Lücken des
#                Pakets, auch für künftige — deshalb hier immer angeben.
#   status       not_affected | affected | fixed | under_investigation   (Wörter wie bei VEX)
#   warum        nur bei not_affected, einer von:
#                component_not_present | vulnerable_code_not_present |
#                vulnerable_code_not_in_execute_path |
#                vulnerable_code_cannot_be_controlled_by_adversary |
#                inline_mitigations_already_exist
#   begruendung  ein bis drei Sätze, die jemand nachprüfen kann
#   massnahme    Pflicht bei affected, sonst nach Bedarf
#   stand        Datum der Bewertung
#
# [[ohne_scan]] — was der Scanner nicht sieht oder nicht meldet (Abschnitt 4):
#   komponente, version, aussage, stand; „offen = true“ kennzeichnet, was in Prüfung ist. Dazu
#   „version_aus“, damit der Bericht merkt, wenn die Aussage nicht mehr zur Version im Bestand
#   passt:
#     "api:PYTHON_VERSION"           Versionsangabe eines Image (schwachstellen.json, stand)
#     "paket:cryptography:openssl"   Bibliothek, die ein Python-Paket mitbringt
#     "sbom:nginx:libssl3"           Paket aus der Stückliste eines Image
#
# [[massnahme]] — Abschnitt „Mögliche Maßnahmen“: titel, wirkung, aufwand.
#
# methode — ein Absatz, der im Bericht unter der Übersicht der Bewertungen steht.

methode = "Geprüft ist je Lücke am gebauten Image: an den Dateien, an den Abhängigkeiten der Programme und in Wegwerf-Containern (welche Prozesse Entrypoint, Kommando und Healthcheck starten, welche Bibliotheken der Python-Prozess beim Import der Anwendung lädt, wer eine Bibliothek einbindet) — nicht an einem laufenden Stack. Jede Bewertung ist in einem zweiten Durchgang gegengeprüft, der sie zu widerlegen suchte."

# ---------------------------------------------------------------------------
# api — Betriebssystem-Pakete (Debian 13). Im Container laufen als Nutzer app (uid 999, ohne
# Capabilities) laut Dockerfile und Compose: der Entrypoint (sh, alembic, sleep), uvicorn, alle 10 s der Healthcheck
# (python) und bei Bedarf Betriebsbefehle per „docker compose exec api python …“. Der Code der
# Anwendung startet keine Unterprozesse.
# ---------------------------------------------------------------------------

[[bewertung]]
image = "api"
paket = "util-linux"
cves = ["CVE-2026-76642", "CVE-2026-78410"]
status = "not_affected"
warum = "vulnerable_code_cannot_be_controlled_by_adversary"
begruendung = "Beide Lücken liegen in libmount und setzen voraus, dass ein Nicht-Root-Nutzer über das setuid-Programm mount einen von root in /etc/fstab freigegebenen Eintrag einhängt (Option user/users mit X-mount.*; bei CVE-2026-76642 zusätzlich ein Hilfsprogramm /sbin/mount.<typ>, bei CVE-2026-78410 ein bind-Eintrag). Im Image enthält /etc/fstab nur eine Kommentarzeile (root, 0644), es gibt kein /sbin/mount.*, und in den geprüften Aufrufen als Nutzer app wurde nichts eingehängt. Nichts im Container startet mount (geprüft am Code und beim Import der Anwendung, nicht an laufenden Anfragen); der Python-Prozess lädt aus util-linux nur libuuid."
stand = "2026-10-13"

