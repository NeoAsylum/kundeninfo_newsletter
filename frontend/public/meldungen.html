<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meldungen — Störungsinfo-Portal</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/abos.html"><span class="brand-mark">S</span> Störungsinfo-Portal</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <div class="topbar-menu" id="topbar-menu">
        <nav class="topbar-nav" aria-label="Hauptnavigation">
          <a href="/abos.html" data-page="abos">Meine Abos</a>
          <a href="/meldungen.html" data-page="meldungen">Meldungen</a>
          <a href="/versand.html" data-page="versand" id="nav-versand" data-admin-only hidden>Versand</a>
          <a href="/empfaenger.html" data-page="empfaenger" id="nav-empfaenger" data-admin-only hidden>Empfänger</a>
          <a href="/verteiler.html" data-page="verteiler" id="nav-verteiler" data-admin-only hidden>Verteiler</a>
          <a href="/rollen.html" data-page="rollen" id="nav-rollen" data-admin-only hidden>Rollen</a>
        </nav>
        <span class="topbar-spacer"></span>
        <div class="topbar-user-area">
          <span class="user-chip" id="user-chip" aria-live="polite">…</span>
          <a class="logout-link" href="#">Abmelden</a>
        </div>
      </div>
    </div>
  </header>

  <main class="page page-wide">
    <div class="page-head">
      <h1>Meldungen</h1>
      <p>Alle versendeten Störungsmeldungen zum Nachschlagen — die neueste zuerst.</p>
    </div>

    <div class="search-row">
      <select id="topic-filter" aria-label="Nach Verteiler filtern">
        <option value="" selected>Alle Verteiler</option>
      </select>
      <span class="result-count" id="result-count" aria-live="polite"></span>
    </div>

    <div class="meldung-list" id="meldung-list">
      <p class="loading-state">Lade Meldungen …</p>
    </div>

    <div class="load-more-row">
      <button type="button" class="btn btn-secondary" id="load-more" hidden>Mehr laden</button>
    </div>
  </main>

  <footer class="footer-links">
    <a href="/datenschutz.html">Datenschutzhinweis</a>
  </footer>

  <script src="/app.js"></script>
  <script src="/meldungen.js"></script>
</body>
</html>
